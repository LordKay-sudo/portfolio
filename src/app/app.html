<div class="page">
  <nav class="nav" aria-label="Primary">
    <a class="nav-brand" href="#top">{{ brand }}</a>
    <div class="nav-links">
      <a href="#work">Enterprise</a>
      <a href="#projects">Open source</a>
      <a href="#skills">Skills</a>
      <a
        mat-stroked-button
        color="primary"
        class="nav-cta"
        [href]="githubProfile"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub
      </a>
    </div>
  </nav>

  <app-hero [brand]="brand" [headline]="headline" [subtitle]="subtitle" />

  <main>
    <section class="section" aria-labelledby="about-heading">
      <div class="section-head">
        <h2 id="about-heading">About</h2>
      </div>
      <p class="summary">{{ summary }}</p>
    </section>

    <app-work-list [items]="work()" />
    <app-projects-list [items]="projects()" />
    <app-skills-filter [skills]="skills()" />
  </main>

  <footer class="site-footer">
    <p>
      <span class="footer-brand">{{ brand }}</span>
    </p>
    <p class="footer-links">
      <a [href]="'mailto:' + email">{{ email }}</a>
      <a [href]="githubProfile" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a [href]="githubUrl" target="_blank" rel="noopener noreferrer">Site source</a>
    </p>
  </footer>
</div>

<router-outlet />
