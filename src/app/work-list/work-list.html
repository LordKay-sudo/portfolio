<section class="section" id="work" aria-labelledby="work-heading">
  <div class="section-head">
    <h2 id="work-heading">Featured work</h2>
    <p class="section-kicker">Production delivery at Arvuti / enterprise</p>
  </div>
  <ol class="project-list">
    @for (p of visible(); track p.title; let i = $index) {
      <li class="project-row">
        <span class="project-index" aria-hidden="true">{{ i + 1 < 10 ? '0' + (i + 1) : i + 1 }}</span>
        <div class="project-body">
          <div class="project-title-row">
            <h3>{{ p.title }}</h3>
            <span class="project-tags">{{ p.tags.join(' / ') }}</span>
          </div>
          <p>{{ p.description }}</p>
        </div>
      </li>
    }
  </ol>
  @if (canToggle()) {
    <div class="work-toggle">
      <button mat-button color="primary" type="button" (click)="toggle()">
        {{ expanded() ? 'Show less' : 'Show all work' }}
      </button>
    </div>
  }
</section>
